[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rare-disease-action-engine"
version = "0.1.0"
description = "Auditable evidence refinement and research-action layer for rare disease"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]
# Postgres is the intended canonical store. It is an extra because the test suite
# runs against SQLite and must not require a database server.
postgres = ["psycopg[binary]>=3.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["atlas"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
